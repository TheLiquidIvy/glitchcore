trigger:
  - main
  - master

pr:
  - main
  - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'

stages:
  - stage: Build
    jobs:
      - job: BuildJob
        displayName: 'Build and Test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - task: Npm@1
            inputs:
              command: 'ci'
              workingDir: 'client'
            displayName: 'npm ci'

          - task: Npm@1
            inputs:
              command: 'run'
              arguments: 'build'
              workingDir: 'client'
            displayName: 'npm run build'

          - task: Npm@1
            inputs:
              command: 'custom'
              customCommand: 'test -- --passWithNoTests --watchAll=false'
              workingDir: 'client'
            displayName: 'npm test'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/client/build'
              artifactName: 'react-build'
            displayName: 'Publish build artifacts'

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy Web App'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'react-build'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION_ID)
                    appName: $(AZURE_WEBAPP_NAME)
                    package: '$(Agent.BuildDirectory)/react-build'
                  displayName: 'Deploy to Azure Web App'
