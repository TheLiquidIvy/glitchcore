<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glitchcore Print-on-Demand with Export</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    /* Reset & base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f0f19;
      color: #00ffea;
      font-family: 'Orbitron', monospace;
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #ff00d4;
      position: relative;
      user-select: none;
    }
    /* Glitch text effect */
    .glitch {
      position: relative;
      color: #00ffea;
      font-weight: 900;
      letter-spacing: 0.1em;
    }
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      right: 0;
      opacity: 0.8;
      clip: rect(0, 900px, 0, 0);
      user-select: none;
    }
    .glitch::before {
      animation: glitchTop 1s infinite linear alternate-reverse;
      color: #ff00d4;
      z-index: -1;
    }
    .glitch::after {
      animation: glitchBottom 1.5s infinite linear alternate-reverse;
      color: #00fff7;
      z-index: -2;
    }
    @keyframes glitchTop {
      0% {
        clip: rect(0, 900px, 10px, 0);
        transform: translate(-2px, -2px);
      }
      50% {
        clip: rect(10px, 900px, 20px, 0);
        transform: translate(2px, 2px);
      }
      100% {
        clip: rect(0, 900px, 10px, 0);
        transform: translate(-2px, -2px);
      }
    }
    @keyframes glitchBottom {
      0% {
        clip: rect(20px, 900px, 30px, 0);
        transform: translate(2px, 2px);
      }
      50% {
        clip: rect(30px, 900px, 40px, 0);
        transform: translate(-2px, -2px);
      }
      100% {
        clip: rect(20px, 900px, 30px, 0);
        transform: translate(2px, 2px);
      }
    }

    /* Container for products */
    .products {
      display: flex;
      gap: 3rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    /* Product card */
    .product {
      background: #22223b;
      border: 2px solid #00ffea;
      border-radius: 16px;
      box-shadow: 0 0 15px #00ffea;
      width: 320px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    .product h2 {
      color: #ff00d4;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      user-select: none;
    }

    /* Upload input styling */
    label.upload-label {
      background: #ff00d4;
      color: #0f0f19;
      padding: 0.6rem 1.2rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px #ff00d4;
      margin-bottom: 1rem;
      transition: background-color 0.3s ease;
      display: inline-block;
      user-select: none;
    }
    label.upload-label:hover,
    label.upload-label:focus {
      background: #00ffea;
      color: #1a1a2e;
      outline: none;
    }
    input[type="file"] {
      display: none;
    }

    /* Preview container */
    .preview-container {
      position: relative;
      width: 280px;
      height: 280px;
      background: #1a1a2e;
      border-radius: 16px;
      box-shadow: inset 0 0 15px #00ffea;
      margin-bottom: 1rem;
      overflow: hidden;
      user-select: none;
    }

    /* Base product image */
    .product-base {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 0 10px #00ffea);
      border-radius: 16px;
      position: relative;
      z-index: 1;
      background: #0f0f19;
    }

    /* User design image */
    .user-design {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 80%;
      max-height: 80%;
      transform-origin: center center;
      cursor: grab;
      border: 2px dashed #ff00d4;
      border-radius: 12px;
      z-index: 2;
      user-select: none;
      transition: box-shadow 0.2s ease;
    }
    .user-design:active {
      cursor: grabbing;
      box-shadow: 0 0 15px #ff00d4;
    }

    /* Controls for scaling and rotation */
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
      user-select: none;
      flex-wrap: wrap;
    }
    .btn-control {
      background: #00ffea;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffea;
      transition: background-color 0.3s ease;
      user-select: none;
      flex: 1 0 40%;
      min-width: 100px;
      text-align: center;
    }
    .btn-control:hover,
    .btn-control:focus {
      background: #ff00d4;
      color: #0f0f19;
      outline: none;
    }

    /* Add to Cart and Download buttons */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      width: 100%;
    }
    .btn-add-cart,
    .btn-download {
      background: #ff00d4;
      color: #0f0f19;
      border: none;
      padding: 0.75rem 2rem;
      font-weight: 900;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff00d4;
      transition: background-color 0.3s ease;
      user-select: none;
      flex: 1 0 40%;
      min-width: 140px;
      text-align: center;
    }
    .btn-add-cart:hover,
    .btn-add-cart:focus,
    .btn-download:hover,
    .btn-download:focus {
      background: #00ffea;
      color: #1a1a2e;
      outline: none;
    }

    /* Description text */
    p.desc-text {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #00fff7;
      user-select: text;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .products {
        flex-direction: column;
        align-items: center;
      }
      .product {
        width: 90%;
        max-width: 320px;
      }
      .controls {
        gap: 0.5rem;
      }
      .btn-control,
      .btn-add-cart,
      .btn-download {
        flex: 1 0 100%;
        min-width: auto;
      }
      .btn-row {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <h1 class="glitch" data-text="Print-on-Demand">Print-on-Demand</h1>

  <div class="products">
    <!-- T-shirt product -->
    <section class="product" aria-label="Customize T-Shirt">
      <h2>T-Shirt</h2>
      <label for="upload-tshirt" class="upload-label" tabindex="0">Upload Design</label>
      <input type="file" accept="image/*" id="upload-tshirt" aria-describedby="tshirt-desc" />
      <div class="preview-container" id="tshirt-preview" aria-live="polite" aria-atomic="true" aria-describedby="tshirt-desc">
        <img src="https://i.imgur.com/5Ff1JxJ.png" alt="T-shirt blank mockup" class="product-base" />
        <!-- User design image will be inserted here -->
      </div>
      <div class="controls" aria-label="Design controls for T-shirt">
        <button class="btn-control" id="tshirt-scale-down" aria-label="Scale design smaller">Scale -</button>
        <button class="btn-control" id="tshirt-scale-up" aria-label="Scale design larger">Scale +</button>
        <button class="btn-control" id="tshirt-rotate-left" aria-label="Rotate design left">Rotate ⟲</button>
        <button class="btn-control" id="tshirt-rotate-right" aria-label="Rotate design right">Rotate ⟳</button>
      </div>
      <div class="btn-row">
        <button class="btn-download" id="tshirt-download" aria-label="Download preview image of T-shirt design">Download Preview</button>
        <button class="btn-add-cart" id="tshirt-add-cart" aria-label="Add customized T-Shirt to cart">Add to Cart</button>
      </div>
      <p id="tshirt-desc" class="desc-text">
        Upload your design and adjust its position, size, and rotation on the t-shirt.
      </p>
    </section>

    <!-- Sneaker product -->
    <section class="product" aria-label="Customize Sneaker">
      <h2>Sneaker</h2>
      <label for="upload-sneaker" class="upload-label" tabindex="0">Upload Design</label>
      <input type="file" accept="image/*" id="upload-sneaker" aria-describedby="sneaker-desc" />
      <div class="preview-container" id="sneaker-preview" aria-live="polite" aria-atomic="true" aria-describedby="sneaker-desc">
        <img src="https://i.imgur.com/gQZq7qV.png" alt="Sneaker blank mockup" class="product-base" />
        <!-- User design image will be inserted here -->
      </div>
      <div class="controls" aria-label="Design controls for Sneaker">
        <button class="btn-control" id="sneaker-scale-down" aria-label="Scale design smaller">Scale -</button>
        <button class="btn-control" id="sneaker-scale-up" aria-label="Scale design larger">Scale +</button>
        <button class="btn-control" id="sneaker-rotate-left" aria-label="Rotate design left">Rotate ⟲</button>
        <button class="btn-control" id="sneaker-rotate-right" aria-label="Rotate design right">Rotate ⟳</button>
      </div>
      <div class="btn-row">
        <button class="btn-download" id="sneaker-download" aria-label="Download preview image of Sneaker design">Download Preview</button>
        <button class="btn-add-cart" id="sneaker-add-cart" aria-label="Add customized Sneaker to cart">Add to Cart</button>
      </div>
      <p id="sneaker-desc" class="desc-text">
        Upload your design and adjust its position, size, and rotation on the sneaker.
      </p>
    </section>
  </div>

  <script>
    // Utility function to enable drag for an element within its container
    function makeDraggable(dragElem, container) {
      let isDragging = false;
      let startX, startY, origX, origY;

      dragElem.addEventListener('pointerdown', e => {
        e.preventDefault();
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const style = window.getComputedStyle(dragElem);
        origX = parseFloat(style.left) || dragElem.offsetLeft;
        origY = parseFloat(style.top) || dragElem.offsetTop;
        dragElem.setPointerCapture(e.pointerId);
      });

      dragElem.addEventListener('pointermove', e => {
        if (!isDragging) return;
        e.preventDefault();
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;

        // Calculate new position with boundaries
        let newX = origX + dx;
        let newY = origY + dy;

        const containerRect = container.getBoundingClientRect();
        const dragRect = dragElem.getBoundingClientRect();

        // Left boundary
        if (newX < 0) newX = 0;
        // Right boundary
        if (newX + dragRect.width > containerRect.width) newX = containerRect.width - dragRect.width;
        // Top boundary
        if (newY < 0) newY = 0;
        // Bottom boundary
        if (newY + dragRect.height > containerRect.height) newY = containerRect.height - dragRect.height;

        dragElem.style.left = newX + 'px';
        dragElem.style.top = newY + 'px';
      });

      dragElem.addEventListener('pointerup', e => {
        isDragging = false;
        dragElem.releasePointerCapture(e.pointerId);
      });

      dragElem.addEventListener('pointerleave', e => {
        isDragging = false;
      });
    }

    // Canvas export function:
    function exportDesign(previewContainer, productBase, userDesign) {
      return new Promise((resolve, reject) => {
        if (!userDesign) {
          reject('No design uploaded');
          return;
        }

        // Create canvas same size as preview container
        const width = previewContainer.clientWidth;
        const height = previewContainer.clientHeight;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        // Draw the base product image first
        const baseImg = new Image();
        baseImg.crossOrigin = "anonymous";
        baseImg.src = productBase.src;

        baseImg.onload = () => {
          ctx.drawImage(baseImg, 0, 0, width, height);

          // Now draw user design with transformations
          const designImg = new Image();
          designImg.crossOrigin = "anonymous";
          designImg.src = userDesign.src;

          designImg.onload = () => {
            // Get user design current style info
            const style = window.getComputedStyle(userDesign);
            // Parse left/top as numbers
            const left = parseFloat(style.left);
            const top = parseFloat(style.top);

            // Calculate scale from transform style
            // transform is like: translate(-50%, -50%) scale(1.2) rotate(15deg)
            const transform = style.transform;

            // Extract scale and rotation from matrix or transform string
            // Fallback values
            let scale = 1;
            let rotation = 0;

            // Parse transform matrix if possible
            if (transform && transform !== 'none') {
              // matrix(a,b,c,d,e,f) format
              const values = transform.match(/matrix\((.+)\)/);
              if (values) {
                const nums = values[1].split(', ').map(parseFloat);
                // scaleX = a; scaleY = d
                scale = Math.sqrt(nums[0] * nums[0] + nums[1] * nums[1]);
                rotation = Math.atan2(nums[1], nums[0]) * (180 / Math.PI);
              } else {
                // fallback parsing scale(x) and rotate(xdeg)
                const scaleMatch = transform.match(/scale\(([\d.]+)\)/);
                if (scaleMatch) scale = parseFloat(scaleMatch[1]);
                const rotateMatch = transform.match(/rotate\(([-\d.]+)deg\)/);
                if (rotateMatch) rotation = parseFloat(rotateMatch[1]);
              }
            }

            // User design image size:
            const designWidth = userDesign.naturalWidth;
            const designHeight = userDesign.naturalHeight;

            // Calculate draw position on canvas
            It cut out indeed! I'll continue and complete the JavaScript export function and the rest of the script so the entire functionality is fully implemented.
            // Calculate draw position on canvas
            // The userDesign is centered on left/top with transform translate(-50%, -50%)
            // So actual position to draw = left, top minus half width*scale & half height*scale
            const drawX = left - (designImg.naturalWidth * scale) / 2;
            const drawY = top - (designImg.naturalHeight * scale) / 2;

            // Save context state
            ctx.save();

            // Move context to center of design image for rotation
            ctx.translate(left, top);
            ctx.rotate((rotation * Math.PI) / 180);
            ctx.scale(scale, scale);

            // Draw the design image centered at 0,0 (because we translated)
            ctx.drawImage(designImg, -designImg.naturalWidth / 2, -designImg.naturalHeight / 2);

            // Restore context to original state
            ctx.restore();

            // Export canvas to data URL
            const dataURL = canvas.toDataURL('image/png');
            resolve(dataURL);
          };

          designImg.onerror = () => {
            reject('Failed to load user design image');
          };
        };

        baseImg.onerror = () => {
          reject('Failed to load base product image');
        };
      });
    }

    // Setup product customization functionality
    function setupProduct(productId) {
      const fileInput = document.getElementById(`upload-${productId}`);
      const previewContainer = document.getElementById(`${productId}-preview`);
      const productBase = previewContainer.querySelector('.product-base');
      const addCartBtn = document.getElementById(`${productId}-add-cart`);
      const downloadBtn = document.getElementById(`${productId}-download`);

      let userImg = null;
      let scale = 1;
      let rotation = 0; // degrees

      // Handle file upload
      fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);

        // Remove existing user image if any
        if (userImg) {
          userImg.remove();
          userImg = null;
        }

        // Create new img element for user design
        userImg = document.createElement('img');
        userImg.src = url;
        userImg.alt = 'Your design';
        userImg.classList.add('user-design');
        userImg.style.left = '50px'; // start near top-left for easier dragging
        userImg.style.top = '50px';
        userImg.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';
        userImg.style.position = 'absolute';

        // Append to preview container
        previewContainer.appendChild(userImg);

        // Reset scale and rotation
        scale = 1;
        rotation = 0;

        // Make it draggable within preview container
        makeDraggable(userImg, previewContainer);
      });

      // Scale controls
      const scaleUpBtn = document.getElementById(`${productId}-scale-up`);
      const scaleDownBtn = document.getElementById(`${productId}-scale-down`);
      const rotateLeftBtn = document.getElementById(`${productId}-rotate-left`);
      const rotateRightBtn = document.getElementById(`${productId}-rotate-right`);

      function updateTransform() {
        if (!userImg) return;
        userImg.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(2)}) rotate(${rotation}deg)`;
      }

      scaleUpBtn.addEventListener('click', () => {
        if (!userImg) return;
        scale += 0.1;
        if (scale > 3) scale = 3;
        updateTransform();
      });

      scaleDownBtn.addEventListener('click', () => {
        if (!userImg) return;
        scale -= 0.1;
        if (scale < 0.3) scale = 0.3;
        updateTransform();
      });

      rotateLeftBtn.addEventListener('click', () => {
        if (!userImg) return;
        rotation -= 15;
        updateTransform();
      });

      rotateRightBtn.addEventListener('click', () => {
        if (!userImg) return;
        rotation += 15;
        updateTransform();
      });

      // Download preview button
      downloadBtn.addEventListener('click', () => {
        if (!userImg) {
          alert('Please upload a design before downloading.');
          return;
        }
        exportDesign(previewContainer, productBase, userImg)
          .then(dataURL => {
            // Create temporary link to trigger download
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = `${productId}-custom-design.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          })
          .catch(err => {
            alert('Error exporting design: ' + err);
          });
      });

      // Simulate Add to Cart
      addCartBtn.addEventListener('click', () => {
        if (!userImg) {
          alert('Please upload a design before adding to cart.');
          return;
        }
        exportDesign(previewContainer, productBase, userImg)
          .then(dataURL => {
            console.log(`Simulated sending design for ${productId} to cart:`);
            console.log(dataURL);
            alert(`Added customized ${productId.replace('-', ' ')} to cart! (Simulated)\nCheck console for image data URL.`);
            // Here you could send dataURL to backend or ecommerce platform
          })
          .catch(err => {
            alert('Error exporting design: ' + err);
          });
      });
    }

    // Initialize both products
    setupProduct('tshirt');
    setupProduct('sneaker');
  </script>
</body>
</html>
