<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glitchcore Print-on-Demand</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    /* Reset & base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f0f19;
      color: #00ffea;
      font-family: 'Orbitron', monospace;
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #ff00d4;
      position: relative;
      user-select: none;
    }
    /* Glitch text effect */
    .glitch {
      position: relative;
      color: #00ffea;
      font-weight: 900;
      letter-spacing: 0.1em;
    }
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      right: 0;
      opacity: 0.8;
      clip: rect(0, 900px, 0, 0);
      user-select: none;
    }
    .glitch::before {
      animation: glitchTop 1s infinite linear alternate-reverse;
      color: #ff00d4;
      z-index: -1;
    }
    .glitch::after {
      animation: glitchBottom 1.5s infinite linear alternate-reverse;
      color: #00fff7;
      z-index: -2;
    }
    @keyframes glitchTop {
      0% {
        clip: rect(0, 900px, 10px, 0);
        transform: translate(-2px, -2px);
      }
      50% {
        clip: rect(10px, 900px, 20px, 0);
        transform: translate(2px, 2px);
      }
      100% {
        clip: rect(0, 900px, 10px, 0);
        transform: translate(-2px, -2px);
      }
    }
    @keyframes glitchBottom {
      0% {
        clip: rect(20px, 900px, 30px, 0);
        transform: translate(2px, 2px);
      }
      50% {
        clip: rect(30px, 900px, 40px, 0);
        transform: translate(-2px, -2px);
      }
      100% {
        clip: rect(20px, 900px, 30px, 0);
        transform: translate(2px, 2px);
      }
    }

    /* Container for products */
    .products {
      display: flex;
      gap: 3rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    /* Product card */
    .product {
      background: #22223b;
      border: 2px solid #00ffea;
      border-radius: 16px;
      box-shadow: 0 0 15px #00ffea;
      width: 320px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    .product h2 {
      color: #ff00d4;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      user-select: none;
    }

    /* Upload input styling */
    label.upload-label {
      background: #ff00d4;
      color: #0f0f19;
      padding: 0.6rem 1.2rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px #ff00d4;
      margin-bottom: 1rem;
      transition: background-color 0.3s ease;
      display: inline-block;
      user-select: none;
    }
    label.upload-label:hover,
    label.upload-label:focus {
      background: #00ffea;
      color: #1a1a2e;
      outline: none;
    }
    input[type="file"] {
      display: none;
    }

    /* Preview container */
    .preview-container {
      position: relative;
      width: 280px;
      height: 280px;
      background: #1a1a2e;
      border-radius: 16px;
      box-shadow: inset 0 0 15px #00ffea;
      margin-bottom: 1rem;
      overflow: hidden;
      user-select: none;
    }

    /* Base product image */
    .product-base {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 0 10px #00ffea);
      border-radius: 16px;
      position: relative;
      z-index: 1;
      background: #0f0f19;
    }

    /* User design image */
    .user-design {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 80%;
      max-height: 80%;
      transform: translate(-50%, -50%);
      cursor: grab;
      border: 2px dashed #ff00d4;
      border-radius: 12px;
      z-index: 2;
      user-select: none;
      transition: box-shadow 0.2s ease;
    }
    .user-design:active {
      cursor: grabbing;
      box-shadow: 0 0 15px #ff00d4;
    }

    /* Controls for scaling */
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
      user-select: none;
    }
    .btn-control {
      background: #00ffea;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffea;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    .btn-control:hover,
    .btn-control:focus {
      background: #ff00d4;
      color: #0f0f19;
      outline: none;
    }

    /* Add to Cart button */
    .btn-add-cart {
      background: #ff00d4;
      color: #0f0f19;
      border: none;
      padding: 0.75rem 2rem;
      font-weight: 900;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff00d4;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    .btn-add-cart:hover,
    .btn-add-cart:focus {
      background: #00ffea;
      color: #1a1a2e;
      outline: none;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .products {
        flex-direction: column;
        align-items: center;
      }
      .product {
        width: 90%;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <h1 class="glitch" data-text="Print-on-Demand">Print-on-Demand</h1>

  <div class="products">
    <!-- T-shirt product -->
    <section class="product" aria-label="Customize T-Shirt">
      <h2>T-Shirt</h2>
      <label for="upload-tshirt" class="upload-label" tabindex="0">Upload Design</label>
      <input type="file" accept="image/*" id="upload-tshirt" aria-describedby="tshirt-desc" />
      <div class="preview-container" id="tshirt-preview" aria-live="polite" aria-atomic="true" aria-describedby="tshirt-desc">
        <img src="https://i.imgur.com/5Ff1JxJ.png" alt="T-shirt blank mockup" class="product-base" />
        <!-- User design image will be inserted here -->
      </div>
      <div class="controls">
        <button class="btn-control" id="tshirt-scale-down" aria-label="Scale design smaller">-</button>
        <button class="btn-control" id="tshirt-scale-up" aria-label="Scale design larger">+</button>
      </div>
      <button class="btn-add-cart" aria-label="Add customized T-Shirt to cart">Add to Cart</button>
      <p id="tshirt-desc" style="margin-top: 0.5rem; font-size: 0.9rem; color: #00fff7;">
        Upload your design and adjust its position and size on the t-shirt.
      </p>
    </section>

    <!-- Sneaker product -->
    <section class="product" aria-label="Customize Sneaker">
      <h2>Sneaker</h2>
      <label for="upload-sneaker" class="upload-label" tabindex="0">Upload Design</label>
      <input type="file" accept="image/*" id="upload-sneaker" aria-describedby="sneaker-desc" />
      <div class="preview-container" id="sneaker-preview" aria-live="polite" aria-atomic="true" aria-describedby="sneaker-desc">
        <img src="https://i.imgur.com/gQZq7qV.png" alt="Sneaker blank mockup" class="product-base" />
        <!-- User design image will be inserted here -->
      </div>
      <div class="controls">
        <button class="btn-control" id="sneaker-scale-down" aria-label="Scale design smaller">-</button>
        <button class="btn-control" id="sneaker-scale-up" aria-label="Scale design larger">+</button>
      </div>
      <button class="btn-add-cart" aria-label="Add customized Sneaker to cart">Add to Cart</button>
      <p id="sneaker-desc" style="margin-top: 0.5rem; font-size: 0.9rem; color: #00fff7;">
        Upload your design and adjust its position and size on the sneaker.
      </p>
    </section>
  </div>

  <script>
    // Utility function to enable drag for an element within its container
    function makeDraggable(dragElem, container) {
      let isDragging = false;
      let startX, startY, origX, origY;

      dragElem.addEventListener('pointerdown', e => {
        e.preventDefault();
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const style = window.getComputedStyle(dragElem);
        origX = parseFloat(style.left) || dragElem.offsetLeft;
        origY = parseFloat(style.top) || dragElem.offsetTop;
        dragElem.setPointerCapture(e.pointerId);
      });

      dragElem.addEventListener('pointermove', e => {
        if (!isDragging) return;
        e.preventDefault();
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;

        // Calculate new position with boundaries
        let newX = origX + dx;
        let newY = origY + dy;

        const containerRect = container.getBoundingClientRect();
        const dragRect = dragElem.getBoundingClientRect();

        // Left boundary
        if (newX < 0) newX = 0;
        // Right boundary
        if (newX + dragRect.width > containerRect.width) newX = containerRect.width - dragRect.width;
        // Top boundary
        if (newY < 0) newY = 0;
        // Bottom boundary
        if (newY + dragRect.height > containerRect.height) newY = containerRect.height - dragRect.height;

        dragElem.style.left = newX + 'px';
        dragElem.style.top = newY + 'px';
      });

      dragElem.addEventListener('pointerup', e => {
        isDragging = false;
        dragElem.releasePointerCapture(e.pointerId);
      });

      dragElem.addEventListener('pointerleave', e => {
        isDragging = false;
      });
    }

    // Setup product customization functionality
    function setupProduct(productId) {
      const fileInput = document.getElementById(`upload-${productId}`);
      const previewContainer = document.getElementById(`${productId}-preview`);
      const addCartBtn = previewContainer.nextElementSibling.nextElementSibling; // The add to cart button is two siblings after preview container
      let userImg = null;
      let scale = 1;

      function updateScaleButtons() {
        // Optional: can disable buttons at min/max scale for UX
      }

      // Handle file upload
      fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);

        // Remove existing user image if any
        if (userImg) {
          userImg.remove();
          userImg = null;
        }

        // Create new img element for user design
        userImg = document.createElement('img');
        userImg.src = url;
        userImg.alt = 'Your design';
        userImg.classList.add('user-design');
        userImg.style.left = '50%';
        userImg.style.top = '50%';
        userImg.style.transform = 'translate(-50%, -50%) scale(1)';
        userImg.style.position = 'absolute';

        // Append to preview container
        previewContainer.appendChild(userImg);

        // Reset scale
        scale = 1;
        updateScaleButtons();

        // Make it draggable within preview container
        makeDraggable(userImg, previewContainer);
      });

      // Scale controls
      const scaleUpBtn = document.getElementById(`${productId}-scale-up`);
      const scaleDownBtn = document.getElementById(`${productId}-scale-down`);

      scaleUpBtn.addEventListener('click', () => {
        if (!userImg) return;
        scale += 0.1;
        if (scale > 3) scale = 3;
        userImg.style.transform = `translate(-50%, -50%) scale(${scale})`;
      });

      scaleDownBtn.addEventListener('click', () => {
        if (!userImg) return;
        scale -= 0.1;
        if (scale < 0.3) scale = 0.3;
        userImg.style.transform = `translate(-50%, -50%) scale(${scale})`;
      });

      // Simulate Add to Cart
      addCartBtn.addEventListener('click', () => {
        if (!userImg) {
          alert('Please upload a design before adding to cart.');
          return;
        }
        alert(`Added customized ${productId.replace('-', ' ')} to cart! (Simulated)`);
        // Here you could serialize the design info and send to backend or Snipcart
      });
    }

    // Initialize both products
    setupProduct('tshirt');
    setupProduct('sneaker');
  </script>
</body>
</html>
